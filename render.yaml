services:
  # Backend API Service
  - type: web
    name: feedback-api
    env: python
    region: oregon
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python ml_model/train_emotion_model.py"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: feedback-db
          property: connectionString
