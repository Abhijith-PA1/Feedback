services:
  # Backend API Service
  - type: web
    name: feedback-api
    env: python
    region: oregon
    buildCommand: "cd backend && pip install -r requirements.txt && python ml_model/train_emotion_model.py"
    startCommand: "cd backend && gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: feedback-db
          property: connectionString

  # Frontend Service
  - type: web
    name: feedback-frontend
    env: static
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://feedback-backend-x85o.onrender.com
